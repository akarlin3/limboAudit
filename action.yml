name: 'limboAudit — Scientific Manuscript, LaTeX/BibTeX & Reproducibility Gate'
author: 'AveryCorp Institute'
description: 'Deterministic epistemic, citation DOI, statistical (GRIM/p-value), figure provenance, and artifact-to-manuscript verification gate.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target-dir:
    description: 'Repository or manuscript directory to audit.'
    required: false
    default: '.'
  tex-file:
    description: 'Optional explicit primary .tex/.md manuscript (otherwise auto-detected).'
    required: false
    default: ''
  bib-file:
    description: 'Optional explicit .bib bibliography (otherwise auto-detected).'
    required: false
    default: ''
  artifacts-json:
    description: 'Optional whitespace-separated list of extra JSON result artifacts.'
    required: false
    default: ''
  profile:
    description: "Gate profile: 'default', 'strict' (warnings also fail the gate), or 'lenient' (ignore unused/preprint references)."
    required: false
    default: 'default'
  fail-on-error:
    description: "Fail the job when the gate fails. Default 'false': report + warnings only."
    required: false
    default: 'false'
  sarif-output:
    description: 'Path for the SARIF 2.1.0 log (upload with github/codeql-action/upload-sarif).'
    required: false
    default: 'limbo-audit.sarif'

outputs:
  readiness-score:
    description: 'Readiness score from 0 to 100.'
    value: ${{ steps.audit.outputs.readiness-score }}
  status:
    description: "Overall status: 'PASS', 'WARN', or 'ACTION NEEDED'."
    value: ${{ steps.audit.outputs.status }}
  total-findings:
    description: 'Total number of findings across all engines.'
    value: ${{ steps.audit.outputs.total-findings }}
  sarif-path:
    description: 'Path to the generated SARIF log.'
    value: ${{ steps.audit.outputs.sarif-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install limbo-audit
      shell: bash
      env:
        LIMBO_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$LIMBO_ACTION_PATH"

    - name: Run limbo-audit ci-summary
      id: audit
      shell: bash
      env:
        LIMBO_TARGET_DIR: ${{ inputs.target-dir }}
        LIMBO_TEX_FILE: ${{ inputs.tex-file }}
        LIMBO_BIB_FILE: ${{ inputs.bib-file }}
        LIMBO_ARTIFACTS: ${{ inputs.artifacts-json }}
        LIMBO_PROFILE: ${{ inputs.profile }}
        LIMBO_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        LIMBO_SARIF: ${{ inputs.sarif-output }}
      run: |
        args=(ci-summary --target-dir "$LIMBO_TARGET_DIR" --profile "$LIMBO_PROFILE"
              --sarif-output "$LIMBO_SARIF" --json-output limbo-audit.json
              --fail-on-error "$LIMBO_FAIL_ON_ERROR")
        if [ -n "$LIMBO_TEX_FILE" ]; then args+=(--tex-file "$LIMBO_TEX_FILE"); fi
        if [ -n "$LIMBO_BIB_FILE" ]; then args+=(--bib-file "$LIMBO_BIB_FILE"); fi
        if [ -n "$LIMBO_ARTIFACTS" ]; then
          read -r -a extra_artifacts <<< "$LIMBO_ARTIFACTS"
          args+=(--artifacts-json "${extra_artifacts[@]}")
        fi
        limbo-audit "${args[@]}"
